# Development environment only (editor, tests). The skill itself runs
# scripts/prism.py with `uv run --script`, whose inline metadata is the source
# of truth for runtime dependencies; keep the two lists in sync.
[project]
name = "beholdr-prism-mini"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]
